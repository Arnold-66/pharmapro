<!-- templates/404.html -->
{% extends 'base.html' %}
{% load static %}

{% block page_title %}Page Not Found{% endblock %}

{% block content %}
<div class="access-denied">
    <i class="fas fa-search" style="color: #6c757d;"></i>
    <h2 class="fw-bold">Page Not Found</h2>
    <p class="text-muted">
        The page you are looking for doesn't exist or has been moved.<br>
        Check the URL or go back to the dashboard.
    </p>
    <div class="mt-3">
        <a href="{% url 'tenants:dashboard' %}" class="btn btn-primary">
            <i class="fas fa-home me-1"></i>Go to Dashboard
        </a>
    </div>
</div>
{% endblock %}
