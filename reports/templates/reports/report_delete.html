{% extends 'accounts/base.html' %}
{% load static %}

{% block title %}Delete Report - PharmaPro{% endblock %}

{% block content %}
<div class="container-fluid px-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-transparent">
                    <h5 class="mb-0 text-danger">
                        <i class="fas fa-exclamation-triangle me-2"></i>Delete Report
                    </h5>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-file-alt fa-4x text-danger mb-3"></i>
                    <h5>Are you sure you want to delete "{{ report.name }}"?</h5>
                    <p class="text-muted">This action cannot be undone.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2 justify-content-center mt-4">
                            <a href="{% url 'reports:report_list' %}" class="btn btn-secondary">
                                <i class="fas fa-times me-1"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash-alt me-1"></i> Delete
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
